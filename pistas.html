<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pistas · Scape Halloween</title>
<style>
  :root {
    --noche: #05070a;
    --niebla: #cfd8cf;
    --moho: #7fa88a;
    --brillo: rgba(127, 168, 138, .45);
    --error: #c97b7b;
  }
  * { box-sizing: border-box; margin: 0; }
  html { min-height: 100%; background: var(--noche); }
  body { min-height: 100%; }
  body {
    color: var(--niebla);
    font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    -webkit-tap-highlight-color: transparent;
    padding: max(1.2rem, env(safe-area-inset-top)) 1.2rem max(1.2rem, env(safe-area-inset-bottom));
  }
  /* Fondo: la mansión completa arriba, fija, que se funde con el fondo oscuro hacia abajo */
  .fondo { position: fixed; top: 0; left: 0; right: 0; z-index: -1; pointer-events: none; }
  .fondo img {
    display: block; width: min(100%, 36rem); height: auto; margin: 0 auto;
    -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent);
            mask-image: linear-gradient(to bottom, #000 72%, transparent);
  }
  #mensaje, .contador { text-shadow: 0 1px 10px rgba(0,0,0,.9); }

  main { max-width: 34rem; margin: 0 auto; display: flex; flex-direction: column; gap: 1.6rem; padding-top: calc(min(100vw, 36rem) * .747 - 2.5rem); }
  .volver {
    position: absolute; top: max(1.2rem, env(safe-area-inset-top)); left: 1.2rem;
    color: var(--niebla); text-decoration: none; font-size: .95rem; opacity: .8;
    border: 1px solid var(--moho); border-radius: 999px; padding: .5rem 1rem;
    background: rgba(5, 7, 10, .6); box-shadow: 0 0 14px var(--brillo);
  }
  .volver:hover { opacity: 1; }
  h1 {
    font-size: clamp(2rem, 9vw, 3rem); font-weight: 400; font-style: italic;
    text-align: center; text-shadow: 0 0 24px var(--brillo);
  }
  .intro { text-align: center; opacity: .9; line-height: 1.6; font-size: 1.1rem; text-shadow: 0 1px 12px rgba(0,0,0,.9); }

  form { display: flex; flex-direction: column; gap: 1rem; }
  input {
    font: inherit; font-size: 1.15rem; color: var(--niebla); text-align: center;
    background: rgba(5,7,10,.6); border: 1px solid var(--moho); border-radius: 999px;
    padding: .9rem 1.4rem; width: 100%;
    box-shadow: inset 0 0 14px rgba(127,168,138,.15);
  }
  input::placeholder { color: rgba(207,216,207,.4); }
  input:focus-visible { outline: 2px solid var(--niebla); outline-offset: 3px; }
  button {
    font: inherit; font-size: 1.1rem; color: var(--niebla);
    background: transparent; border: 1px solid var(--moho); border-radius: 999px;
    padding: .85rem 2rem; cursor: pointer; align-self: center;
    box-shadow: 0 0 22px var(--brillo), inset 0 0 14px rgba(127,168,138,.15);
    transition: background .25s;
  }
  button:hover { background: rgba(127,168,138,.12); }
  button:focus-visible { outline: 2px solid var(--niebla); outline-offset: 4px; }

  #mensaje { min-height: 1.5rem; text-align: center; font-style: italic; }
  #mensaje.mal { color: var(--error); animation: tiembla .4s; }
  @keyframes tiembla { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

  #lista { display: flex; flex-direction: column; gap: 1rem; list-style: none; padding: 0; }
  #lista li {
    border: 1px solid rgba(127,168,138,.5); border-radius: 14px; padding: 1.1rem 1.2rem;
    background: rgba(5,7,10,.72); line-height: 1.6;
    box-shadow: 0 0 18px rgba(127,168,138,.15);
    animation: aparece 1.4s ease;
  }
  #lista li small { display: block; opacity: .55; margin-bottom: .3rem; letter-spacing: .08em; text-transform: uppercase; font-size: .72rem; }
  @keyframes aparece { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }
  .contador { text-align: center; opacity: .6; font-size: .9rem; }
  .borrar { align-self: center; font-size: .8rem; padding: .4rem 1rem; opacity: .5; box-shadow: none; }

  /* Estilos para el mensaje final */
  #victoria {
    text-align: center;
    font-size: clamp(1.6rem, 6vw, 2.2rem);
    font-weight: bold;
    font-style: italic;
    color: var(--niebla);
    text-shadow: 0 0 15px var(--niebla), 0 0 25px var(--brillo);
    border: 2px dashed var(--moho);
    border-radius: 16px;
    padding: 2.5rem 1.5rem;
    background: rgba(5, 7, 10, .72);
    box-shadow: inset 0 0 30px rgba(127, 168, 138, 0.2), 0 0 40px var(--brillo);
    margin-top: 1rem;
    animation: aparece-victoria 2.5s ease-out forwards;
  }
  
  @keyframes aparece-victoria {
    0% { opacity: 0; transform: scale(0.8) translateY(20px); filter: blur(10px); }
    100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    #lista li, #mensaje.mal, #victoria { animation: none; }
  }
</style>
</head>
<body>

<div class="fondo" aria-hidden="true"><img src="mansion_001.jpg" alt=""></div>

<a class="volver" href="index.html">← Volver</a>

<main>
  <h1></h1>
  
  <!-- Texto de introducción actualizado -->
  <p class="intro">En la caja habéis encontrado los sobres con mis últimos casos sin resolver, con cada uno obtendréis una palabra que deberéis introducir en la aplicación para encontrar lo que anhelais.</p>

  <form id="formulario" autocomplete="off">
    <input id="texto" type="text" placeholder="Escribe la solución…" enterkeyhint="send" autocapitalize="off" spellcheck="false" aria-label="Solución del acertijo">
    <button type="submit">Comprobar</button>
  </form>

  <p id="mensaje" role="status" aria-live="polite"></p>

  <!-- Mensaje final (Oculto por defecto) -->
  <div id="victoria" hidden>
    <p>Busca fuera del cementerio, dentro de las ruedas gastadas</p>
  </div>

  <p class="contador" id="contador"></p>
  <ul id="lista"></ul>
  <button class="borrar" id="borrar" type="button" hidden>Borrar pistas descubiertas</button>
</main>

<script>
  /* ============================================================
     EDITA AQUÍ TUS ACERTIJOS
     - respuestas: todas las formas válidas de escribir la solución
       (no importan mayúsculas, tildes ni espacios de más).
     - pista: el texto que se revelará al acertar.
     ============================================================ */
  const ACERTIJOS = [
    {
      respuestas: ["ahorcado", "el ahorcado", "flamenco"],
      pista: "Bien hecho. Has resuelto uno de los casos, se ve que la música es lo tuyo."
    },
    {
      respuestas: ["espejo", "maleta"],
      pista: "Has seguido el rastro del esqueleto, sigue así."
    },
    {
      respuestas: ["fantasma", "un fantasma", "flecha"],
      pista: "Muy bien otro caso resuelto!"
    }
  ];
  /* ============================================================ */

  const CLAVE = "scape_pistas_halloween";
  const form = document.getElementById("formulario");
  const texto = document.getElementById("texto");
  const mensaje = document.getElementById("mensaje");
  const lista = document.getElementById("lista");
  const contador = document.getElementById("contador");
  const borrar = document.getElementById("borrar");
  const victoria = document.getElementById("victoria");

  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                     .replace(/[^a-z0-9ñ ]/g, "").replace(/\s+/g, " ").trim();

  let resueltos = [];
  try { resueltos = JSON.parse(localStorage.getItem(CLAVE)) || []; } catch (e) {}
  const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(resueltos)); } catch (e) {} };

  function pintar() {
    lista.innerHTML = "";
    resueltos.forEach(i => {
      const a = ACERTIJOS[i]; if (!a) return;
      const li = document.createElement("li");
      const s = document.createElement("small");
      s.textContent = "Pista " + (i + 1);
      li.append(s, document.createTextNode(a.pista));
      lista.append(li);
    });
    
    // Comprobar si han resuelto todos los casos
    if (resueltos.length === ACERTIJOS.length) {
      victoria.hidden = false;
      form.style.display = "none"; // Oculta el formulario porque ya no hace falta
      mensaje.textContent = "";
      contador.textContent = "¡Todos los casos resueltos!";
    } else {
      victoria.hidden = true;
      form.style.display = "flex";
      contador.textContent = resueltos.length ? resueltos.length + " de " + ACERTIJOS.length + " pistas descubiertas" : "";
    }
    
    borrar.hidden = !resueltos.length;
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    const t = norm(texto.value);
    if (!t) return;
    const i = ACERTIJOS.findIndex(a => a.respuestas.some(r => norm(r) === t));
    mensaje.className = "";
    void mensaje.offsetWidth; // reinicia la animación
    if (i === -1) {
      mensaje.textContent = "Nada ocurre… Prueba otra vez.";
      mensaje.className = "mal";
    } else if (resueltos.includes(i)) {
      mensaje.textContent = "Esa pista ya la tienes.";
    } else {
      resueltos.push(i);
      resueltos.sort((a, b) => a - b);
      guardar();
      mensaje.textContent = "El espíritu susurra una pista…";
      pintar();
    }
    texto.value = "";
  });

  borrar.addEventListener("click", () => {
    resueltos = []; guardar(); pintar(); mensaje.textContent = "";
  });

  pintar();
</script>
</body>        
</html>
